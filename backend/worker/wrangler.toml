name = "google-services"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
# Comma-separated browser origins allowed to call the API.
# Local preview + GitHub Pages are included by default.
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8787,http://localhost:8787,https://shamratx.github.io,https://townloc.com,https://www.townloc.com"

# Lead notifications go to Zoho inbox
RECIPIENT_EMAIL = "contact@townloc.com"

# From address — requires townloc.com verified in Resend (DNS: SPF/DKIM)
# Until verified, Resend will reject sends from this address.
SENDER_EMAIL = "Townloc <contact@townloc.com>"

# RESEND_API_KEY is stored as a secret (not in this file).
# Set it with:  npx wrangler secret put RESEND_API_KEY

# D1 — create the database first, then paste its UUID below:
#   npx wrangler d1 create google-services-leads
[[d1_databases]]
binding = "DB"
database_name = "google-services-leads"
database_id = "e8467b53-8717-4954-981d-201cd729a9a3"
migrations_dir = "migrations"
