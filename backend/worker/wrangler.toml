name = "google-services"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
# Comma-separated browser origins allowed to call the API.
# Local preview + GitHub Pages are included by default.
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8787,http://localhost:8787,https://shamratx.github.io"

# Email notification recipient (change without redeploying by using `wrangler secret`)
RECIPIENT_EMAIL = "shamratar@gmail.com"

# Sender address — use onboarding@resend.dev until you verify a custom domain in Resend
SENDER_EMAIL = "Northline <onboarding@resend.dev>"

# RESEND_API_KEY is stored as a secret (not in this file).
# Set it with:  npx wrangler secret put RESEND_API_KEY

# D1 — create the database first, then paste its UUID below:
#   npx wrangler d1 create google-services-leads
[[d1_databases]]
binding = "DB"
database_name = "google-services-leads"
database_id = "e8467b53-8717-4954-981d-201cd729a9a3"
migrations_dir = "migrations"
